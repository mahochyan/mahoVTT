<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>怒火与荣耀 · 训练遭遇</title>
  <link rel="stylesheet" href="/games/wrath-glory/style.css">
</head>
<body>
  <header class="top">
    <a class="back" href="/games" data-link>← 游戏厅</a>
    <div class="brand"><b>怒火与荣耀</b><span>Wrath &amp; Glory · 代达隆</span></div>
    <span class="tag">非官方授权 · 原创 demo</span>
  </header>

  <main>
    <section id="start" class="panel">
      <img id="cover" class="cover" src="/games/wrath-glory/art/graveyard-shift.webp" alt="代达隆墓地卫星" onerror="this.remove()">
      <p class="eyebrow">GRAVEYARD SHIFT · TIER 1</p>
      <h1>代达隆：Graveyard Shift</h1>
      <p class="lead">墓地卫星代达隆。审判庭密探门德斯要你们从盖尔弗拉杜斯墓城取回“启示者”。五段调查、两场遭遇，所有判定走 C7 骰池与怒火骰结算。</p>
      <div id="start-party" class="cards"></div>
      <div id="scenarios" class="actions"></div>
      <p id="start-msg" class="msg"></p>
      <p class="fine">Graveyard Shift 为本地私有改编包，不复刻官方原文；训练遭遇仍保留为规则演示。</p>
    </section>

    <section id="play" hidden>
      <div class="bar">
        <div><span id="scene-part" class="eyebrow">SCENE</span><h1 id="scene-title">训练场</h1></div>
        <div class="pools">
          <span class="pool">荣耀 <b id="glory">0</b></span>
          <span class="pool">毁灭 <b id="ruin">0</b></span>
          <span class="pool">轮次 <b id="round">1</b></span>
        </div>
      </div>
      <p id="scene-text" class="lead small"></p>
      <div id="clues" class="clues"></div>
      <div id="choices" class="actions"></div>

      <section class="narration">
        <div class="panel-head"><h2>GM 叙述</h2><span class="faint">本地模型 · 只叙述已结算事实</span></div>
        <p id="narration" class="lead small">雨声压低了远处的钟声。你想做什么？</p>
        <div class="ask-row">
          <input id="gm-input" maxlength="400" placeholder="描述行动，例如：我去档案室查盖尔弗拉杜斯家谱">
          <button id="ask-gm" class="btn primary">让 GM 处理</button>
        </div>
      </section>

      <div class="grid">
        <section>
          <h2>小队</h2>
          <div id="party" class="cards"></div>
        </section>
        <section>
          <h2>目标</h2>
          <div id="enemy" class="cards"></div>
          <div id="pending" class="pending" hidden></div>
        </section>
      </div>

      <section class="log-panel">
        <h2>行动记录</h2>
        <ol id="log"></ol>
      </section>

      <div id="end" class="actions" hidden>
        <button id="restart-btn" class="btn ghost">重新开始</button>
      </div>
    </section>
  </main>

  <script type="module" src="/games/wrath-glory/app.js"></script>
</body>
</html>
