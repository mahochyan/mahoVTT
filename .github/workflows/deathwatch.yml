name: Deathwatch module
on:
  pull_request:
    paths:
      - 'modules/deathwatch/**'
      - 'public/games/deathwatch/**'
      - 'src/games/hub.ts'
      - 'tests/deathwatch*'
      - '.github/workflows/deathwatch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/deathwatch.test.mjs tests/deathwatch-http.test.mjs
      - run: node --check public/games/deathwatch/app.js
      - name: Archive exact source for reproducibility
        if: always()
        run: git archive --format=zip --output=/tmp/mahovtt-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mahovtt-source
          path: /tmp/mahovtt-source.zip
          retention-days: 7
